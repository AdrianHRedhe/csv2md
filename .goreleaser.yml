version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: csv2md
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: csv2md
    repository:
      owner: adrianhredhe
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/adrianhredhe/csv2md
    description: "Convert CSV files to Markdown tables"
    license: MIT
    test: |
      system "#{bin}/csv2md", "-h"
    install: |
      bin.install "csv2md"
